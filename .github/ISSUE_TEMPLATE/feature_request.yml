name: Feature Request
description: Discuss a concrete problem and proposed behavior before significant implementation.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe a concrete use case and its constraints. Requests framed only as "Add technology X" do not explain the need.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: How do you handle this today, and why are existing PJS APIs insufficient? Say if there is no workaround.
    validations:
      required: true
  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: Explain the contract you want. For API proposals, include failure semantics, ownership implications, compatibility impact, and testing strategy.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: api-changes
    attributes:
      label: Does this involve public API or type changes?
      options:
        - 'Yes'
        - 'No'
        - Unsure
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Significant runtime/API changes should be discussed before substantial implementation.
        See [CONTRIBUTING.md](https://github.com/Miskovy/pjs/blob/main/CONTRIBUTING.md).
        Proposals are welcome; acceptance is not guaranteed. Report vulnerabilities privately via
        [SECURITY.md](https://github.com/Miskovy/pjs/blob/main/SECURITY.md).
