name: Runtime and installed package
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Bounded RC soak profile (heavy runs are manual)
        type: choice
        options: [standard, extended]
        default: standard

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.13.0, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen v0.15 baseline
        run: |
          git rev-parse --verify "refs/tags/v0.15.0^{commit}"
          git rev-parse v0.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Each job owns its runner; all heavy checks within a job are sequential.
      - name: Contracts, installed package and bounded soak
        if: runner.os != 'Windows'
        run: npm run rc:qualify -- --physical-boundary-repair --profile=${{ inputs.profile || 'smoke' }} --output=.node-tools/rc-ci.json
      - name: Contracts, installed package and bounded soak
        if: runner.os == 'Windows'
        shell: cmd
        run: npm.cmd run rc:qualify -- --physical-boundary-repair --profile=${{ inputs.profile || 'smoke' }} --output=.node-tools/rc-ci.json
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-contracts-${{ matrix.os }}-node-${{ matrix.node }}
          path: .node-tools/rc-ci.json*
          include-hidden-files: true
