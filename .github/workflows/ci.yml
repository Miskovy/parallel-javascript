name: Runtime and installed package
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - name: Installed declarations and real module workers, native and Vite
        run: npm run test:browser
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.23.4, 24.22.1, 26.12.1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen v0.15 baseline
        run: |
          git rev-parse --verify "refs/tags/v0.15.0^{commit}"
          git rev-parse v0.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          architecture: x64
          cache: npm
      - name: Record and verify executing Node
        run: |
          node -e "const assert = require('node:assert/strict'); assert.equal(process.versions.node, process.env.PJS_EXPECTED_NODE); assert.equal(process.arch, 'x64'); console.log(JSON.stringify({ node: process.version, versions: process.versions, platform: process.platform, arch: process.arch, executable: process.execPath }));"
        env:
          PJS_EXPECTED_NODE: ${{ matrix.node }}
      - run: npm ci
      - name: Provision integrity-pinned publication CLI independently of runtime npm
        id: release-cli
        if: runner.os != 'Windows'
        run: npm run release:npm -- "$RUNNER_TEMP/pjs-release-cli"
      - name: Provision integrity-pinned publication CLI independently of runtime npm
        id: release-cli-windows
        if: runner.os == 'Windows'
        shell: cmd
        run: npm.cmd run release:npm -- "%RUNNER_TEMP%/pjs-release-cli"
      # Each job owns its runner; all heavy checks within a job are sequential.
      - name: R2 deterministic histories and real-worker evidence
        if: always() && runner.os != 'Windows'
        run: npm run test:r2 -- --output=.node-tools/r2/ci
        env:
          PJS_DEBUG_RESERVATION_INVARIANTS: '1'
      - name: R2 deterministic histories and real-worker evidence
        if: always() && runner.os == 'Windows'
        shell: cmd
        run: npm.cmd run test:r2 -- --output=.node-tools/r2/ci
        env:
          PJS_DEBUG_RESERVATION_INVARIANTS: '1'
      - name: R3 bounded memory and resource lifecycle campaign
        if: always() && runner.os != 'Windows'
        run: npm run test:r3 -- --output=.node-tools/r3/ci
      - name: R3 bounded memory and resource lifecycle campaign
        if: always() && runner.os == 'Windows'
        shell: cmd
        run: npm.cmd run test:r3 -- --output=.node-tools/r3/ci
      - name: Contracts, installed package and bounded soak
        if: runner.os != 'Windows'
        run: npm run runtime:qualify -- --release-npm-cli="${{ steps.release-cli.outputs.path }}" --r2-report=.node-tools/r2/ci/report.json --r3-report=.node-tools/r3/ci/report.json --output=.node-tools/runtime-ci.json
      - name: Contracts, installed package and bounded soak
        if: runner.os == 'Windows'
        shell: cmd
        run: npm.cmd run runtime:qualify -- --release-npm-cli="${{ steps.release-cli-windows.outputs.path }}" --r2-report=.node-tools/r2/ci/report.json --r3-report=.node-tools/r3/ci/report.json --output=.node-tools/runtime-ci.json
      - name: Exact supported minimum identity and supplemental compatibility checks
        if: always()
        run: node scripts/node-floor-checks.mjs
        env:
          PJS_EXPECTED_NODE: ${{ matrix.node }}
          PJS_RELEASE_NPM_CLI: ${{ steps.release-cli.outputs.path || steps.release-cli-windows.outputs.path }}
      - name: Registered release candidate qualification
        if: startsWith(github.head_ref, 'release/') || startsWith(github.ref_name, 'release/')
        run: node scripts/rc/qualify.mjs --npm-cli="${{ steps.release-cli.outputs.path || steps.release-cli-windows.outputs.path }}" --release-npm-cli="${{ steps.release-cli.outputs.path || steps.release-cli-windows.outputs.path }}" --profile=standard --output=.node-tools/rc-candidate.json
      - name: Retain supported minimum identity and supplemental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-floor-${{ matrix.os }}-${{ matrix.node }}
          path: .node-tools/node-floor/
          include-hidden-files: true
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-contracts-${{ matrix.os }}-node-${{ matrix.node }}
          path: .node-tools/runtime-ci.json*
          include-hidden-files: true
      - name: Retain R2 histories, divergences, reductions and worker checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-lifecycle-${{ matrix.os }}-node-${{ matrix.node }}
          path: .node-tools/r2/
          include-hidden-files: true
      - name: Retain R3 configs, measurements and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-memory-${{ matrix.os }}-node-${{ matrix.node }}
          path: .node-tools/r3/
          include-hidden-files: true
